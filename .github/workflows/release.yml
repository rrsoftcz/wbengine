name: Release assets

# When a GitHub release is published: build the single-file MCP server, test it and attach it to the
# release together with its checksum.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mcp-phar:
    name: wbengine-mcp.phar
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: wbengine_test
          MYSQL_USER: wb_test
          MYSQL_PASSWORD: wb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uwb_test -pwb_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WB_TEST_DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, json, phar, openssl
          coverage: none
          tools: composer:v2

      - name: The tag must match the server version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(php -r 'require "Mcp/Protocol.php"; echo Wbengine\Mcp\Protocol::SERVER_VERSION;')
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Protocol::SERVER_VERSION v$version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create the test schema
        run: mysql -h 127.0.0.1 -uwb_test -pwb_test wbengine_test < tests/schema.sql

      - name: Build the phar
        run: php -d phar.readonly=0 bin/build-phar.php

      - name: Test the built phar
        run: |
          vendor/bin/phpunit tests/Unit/Mcp/PharTest.php
          WB_MCP_PHAR="$PWD/build/wbengine-mcp.phar" vendor/bin/phpunit tests/Integration/McpEndToEndTest.php

      - name: Attach the phar and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/wbengine-mcp.phar build/wbengine-mcp.phar.sha256 --clobber
