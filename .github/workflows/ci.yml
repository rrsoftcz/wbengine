name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        db: ['mysql:8.4']
        include:
          - php: '8.4'
            db: 'mariadb:10.11'
          - php: '8.4'
            db: 'mariadb:11.4'

    services:
      mysql:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: wbengine_test
          MYSQL_USER: wb_test
          MYSQL_PASSWORD: wb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uwb_test -pwb_test || mariadb-admin ping -h 127.0.0.1 -uwb_test -pwb_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WB_TEST_DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, json, apcu, pcntl, posix
          ini-values: apc.enable_cli=1, error_reporting=E_ALL
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check for known vulnerabilities
        run: composer audit

      - name: Lint
        run: composer lint

      - name: Create the test schema
        run: mysql -h 127.0.0.1 -uwb_test -pwb_test wbengine_test < tests/schema.sql

      - name: Tests
        run: composer test

  smarty-compat:
    name: Optional Smarty compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, mysqli
          coverage: none
          tools: composer:v2
      - name: Test isolated optional package
        run: sh compat/smarty/bin/test

  texy-migration:
    name: Optional Texy migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, mysqli
          coverage: none
          tools: composer:v2
      - name: Test isolated offline bridge
        run: sh compat/texy-migration/bin/test
