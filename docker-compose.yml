# Test environment: PHP 8.4 CLI and MySQL 8.4 (DB_IMAGE=mariadb:11.4 and PHP_VERSION=8.3 pick others).
#
#   docker compose run --rm php composer install
#   docker compose run --rm php composer test
#
# The database is created and seeded from tests/schema.sql on first start.
services:
    php:
        build:
            context: docker
            args:
                # docker compose run with PHP_VERSION=8.3 to test another version
                PHP_VERSION: ${PHP_VERSION:-8.4}
        working_dir: /app
        volumes:
            - ./:/app
        environment:
            WB_TEST_DB_HOST: db
        depends_on:
            db:
                condition: service_healthy
    db:
        image: ${DB_IMAGE:-mysql:8.4}
        environment:
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_DATABASE: wbengine_test
            MYSQL_USER: wb_test
            MYSQL_PASSWORD: wb_test
        volumes:
            - ./tests/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
        healthcheck:
            # MariaDB 11 renamed the client programs, so try both names.
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uwb_test -pwb_test || mariadb-admin ping -h 127.0.0.1 -uwb_test -pwb_test"]
            interval: 3s
            timeout: 3s
            retries: 30
